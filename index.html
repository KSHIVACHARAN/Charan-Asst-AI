<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Charan AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- Background -->
    <div class="space"></div>

    <div class="grid"></div>

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- APP -->

    <div class="app">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">

                <div class="brand-orb">
                    ✦
                </div>

                <div>
                    <h1>CHARAN AI</h1>
                    <p>PERSONAL INTELLIGENCE</p>
                </div>

            </div>


            <button
                id="newChatButton"
                class="new-chat"
            >
                <span>＋</span>
                New Conversation
            </button>


            <div class="menu-title">
                SYSTEM
            </div>


            <button class="menu-item active">
                <span>⌂</span>
                Home
            </button>

            <button class="menu-item">
                <span>◉</span>
                Conversations
            </button>

            <button class="menu-item">
                <span>☆</span>
                Favorites
            </button>


            <div class="menu-title recent-title">
                RECENT
            </div>


            <div
                id="recentChats"
                class="recent-chats"
            ></div>


            <div class="sidebar-bottom">

                <div class="system-status">

                    <span class="status-light"></span>

                    <div>
                        <strong>AI SYSTEM</strong>
                        <small>ONLINE</small>
                    </div>

                </div>


                <div class="profile">

                    <div class="profile-avatar">
                        C
                    </div>

                    <div>
                        <strong>Shivacharan</strong>
                        <small>Personal Account</small>
                    </div>

                </div>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">


            <!-- TOPBAR -->

            <header class="topbar">

                <div class="mobile-brand">
                    ✦ CHARAN AI
                </div>


                <div class="connection">

                    <span></span>

                    AI ONLINE

                </div>


                <button class="top-button">
                    ⚙
                </button>

            </header>



            <!-- CHAT -->

            <section
                id="chatArea"
                class="chat-area"
            >


                <!-- HERO -->

                <div
                    id="welcomeScreen"
                    class="welcome"
                >

                    <div class="orb-container">

                        <div class="orb-ring ring-one"></div>

                        <div class="orb-ring ring-two"></div>

                        <div class="orb-ring ring-three"></div>


                        <div class="ai-orb">

                            <div class="orb-inner">
                                ✦
                            </div>

                        </div>

                    </div>


                    <div class="status-label">
                        SYSTEM READY
                    </div>


                    <h2>
                        Hello, Shivacharan
                    </h2>


                    <p>
                        I'm <strong>Charan AI</strong>.
                    </p>


                    <p class="subtext">
                        Your intelligent personal assistant.
                    </p>


                </div>



                <!-- QUICK ACTIONS -->

                <div class="quick-actions">


                    <button
                        class="action-card"
                        data-prompt="Help me write a Java program"
                    >

                        <div class="action-icon">
                            &lt;/&gt;
                        </div>

                        <div>
                            <strong>Coding</strong>
                            <span>Build & debug code</span>
                        </div>

                        <b>→</b>

                    </button>



                    <button
                        class="action-card"
                        data-prompt="Teach me computer networks in a simple way"
                    >

                        <div class="action-icon">
                            ◈
                        </div>

                        <div>
                            <strong>Study</strong>
                            <span>Learn difficult topics</span>
                        </div>

                        <b>→</b>

                    </button>



                    <button
                        class="action-card"
                        data-prompt="Explain Power BI and DAX"
                    >

                        <div class="action-icon">
                            ◫
                        </div>

                        <div>
                            <strong>Data</strong>
                            <span>Power BI & analytics</span>
                        </div>

                        <b>→</b>

                    </button>



                    <button
                        class="action-card"
                        data-prompt="Help me create a modern website"
                    >

                        <div class="action-icon">
                            ◉
                        </div>

                        <div>
                            <strong>Web</strong>
                            <span>Build modern websites</span>
                        </div>

                        <b>→</b>

                    </button>


                </div>



                <!-- MESSAGES -->

                <div
                    id="conversation"
                    class="conversation"
                ></div>


            </section>



            <!-- INPUT -->

            <div class="input-area">


                <div
                    id="typingIndicator"
                    class="typing-indicator hidden"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                    Charan AI is thinking...

                </div>


                <div class="input-box">


                    <button
                        id="attachButton"
                        class="input-button"
                    >
                        ＋
                    </button>


                    <input
                        id="userInput"
                        type="text"
                        autocomplete="off"
                        placeholder="Ask Charan AI anything..."
                    >


                    <button
                        id="micButton"
                        class="input-button mic"
                        title="Voice input"
                    >
                        🎙
                    </button>


                    <button
                        id="sendButton"
                        class="send-button"
                        title="Send"
                    >
                        ➤
                    </button>


                </div>


                <p class="disclaimer">
                    Charan AI may make mistakes. Verify important information.
                </p>

            </div>


        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
